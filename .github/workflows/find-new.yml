name: Find new events

# Looks for new vendor markets, craft fairs and pop-ups anywhere in Florida (statewide
# since Nov 9, 2026) every 2 hours, adds them as "Unverified" (found_by: auto-finder), then
# runs the hourly refresh so the counts stay right. The daily check verifies them
# against the organizer's own page. Shares the "hourly-refresh" concurrency group so
# the two robots never push at the same time. Second slot at :53 is a backup in case
# GitHub's scheduler skips the :23 run. (Schedule re-registered Nov 1, 2026.)
on:
  schedule:
    - cron: "23 */2 * * *"
    - cron: "53 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The listings live in the member database now (not in this public repo):
      # pull, find + refresh, push back (retry when someone edited meanwhile). Nothing is committed to git,
      # and the log prints counts only, never listings.
      - name: Find new events
        env:
          TZ: America/New_York
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          for i in 1 2 3 4; do
            python3 scripts/db_sync.py pull events finder_seen || exit 1
            python3 scripts/find_new.py > /dev/null || exit 1
            python3 scripts/refresh.py > /dev/null || exit 1
            python3 -c 'import json;r=json.load(open("data/finder_seen.json")).get("last_run",{});print(len(r.get("added",[])),"added")' || true
            python3 scripts/db_sync.py push events finder_seen && exit 0
            rc=$?; [ "$rc" -eq 3 ] || exit "$rc"
            sleep $((i * 7))
          done
          exit 1
