name: Find new events

# Looks for new vendor markets, craft fairs and pop-ups in the 7 Northeast Florida
# counties every 2 hours, adds them as "Unverified" (found_by: auto-finder), then
# runs the hourly refresh so the counts stay right. The daily check verifies them
# against the organizer's own page. Shares the "hourly-refresh" concurrency group so
# the two robots never push at the same time.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find new events
        env:
          TZ: America/New_York
        run: python3 scripts/find_new.py

      - name: Refresh listings
        env:
          TZ: America/New_York
        run: python3 scripts/refresh.py

      - name: Commit if anything changed
        env:
          TZ: America/New_York
        run: |
          if git diff --quiet -- data/ && [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "jve-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg() { echo "Find new events $(date '+%b %-d %-I:%M %p ET'): $(python3 -c 'import json;r=json.load(open("data/finder_seen.json"))["last_run"];print(len(r["added"]),"added")')"; }
          git add data/events.json data/events.js data/finder_seen.json
          git commit -m "$(msg)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push refused (someone else committed); redoing the run on the latest copy."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 scripts/find_new.py
            python3 scripts/refresh.py
            if git diff --quiet -- data/ && [ -z "$(git status --porcelain -- data/)" ]; then exit 0; fi
            git add data/events.json data/events.js data/finder_seen.json
            git commit -m "$(msg)"
            sleep $((i * 5))
          done
          exit 1
