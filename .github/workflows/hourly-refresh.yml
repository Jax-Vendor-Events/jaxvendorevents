name: Hourly refresh

# Keeps the listings current around the clock: drops past dates, rolls weekly and
# monthly markets forward, recomputes the counts and stamps the time.
# Runs at 7 minutes past every hour (GitHub may start scheduled runs a few minutes late).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh listings
        env:
          TZ: America/New_York
        run: python3 scripts/refresh.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "No change."
            exit 0
          fi
          git config user.name "jve-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/events.js
          git commit -m "Hourly refresh $(TZ=America/New_York date '+%b %-d %-I:%M %p ET')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push refused (someone else committed); rebuilding on the latest copy."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 scripts/refresh.py
            if git diff --quiet -- data/; then exit 0; fi
            git add data/events.json data/events.js
            git commit -m "Hourly refresh $(TZ=America/New_York date '+%b %-d %-I:%M %p ET')"
            sleep $((i * 5))
          done
          exit 1
