name: Hourly refresh

# Keeps the listings current around the clock: drops past dates, rolls weekly and
# monthly markets forward, recomputes the counts and stamps the time.
# Runs at 7 and 41 minutes past every hour. GitHub's scheduler can start runs late or
# skip one when it is busy, so the second slot is a backup; a run with nothing to change
# commits nothing. (Schedule re-registered Nov 1, 2026.)
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "41 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # only to commit the public teaser feeds (api/, feeds/)

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The listings live in the member database now (not in this public repo):
      # pull them, refresh, push back. A push refused because someone edited meanwhile
      # (exit 3) pulls again and redoes the run. Nothing is committed to git.
      - name: Refresh listings in the member database
        env:
          TZ: America/New_York
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          for i in 1 2 3 4; do
            python3 scripts/db_sync.py pull events || exit 1
            python3 scripts/refresh.py > /dev/null || exit 1
            python3 scripts/db_sync.py push events && exit 0
            rc=$?; [ "$rc" -eq 3 ] || exit "$rc"
            sleep $((i * 7))
          done
          exit 1

      # Public teaser feeds for search engines and AI agents (api/events.json, feeds/events.ics, feeds/events.rss).
      # Built through the logged-out door (publishable key, no login), so they never carry more than the public site.
      # Committed only when their content changed.
      - name: Build public teaser feeds
        env:
          TZ: America/New_York
        run: |
          python3 scripts/build_feeds.py || exit 0
          python3 scripts/build_area_pages.py || true   # county pages for search (fl/), Nov 9 2026
          git add api/events.json feeds/events.ics feeds/events.rss fl sitemap-areas.xml about.html
          if git diff --cached --quiet; then echo "feeds unchanged"; exit 0; fi
          git -c user.name="jve-feeds" -c user.email="admin@jaxvendorevents.com" commit -m "Public teaser feeds refreshed"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 5)); done
          echo "feed push failed"; exit 0
